name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Executables
    runs-on: windows-latest
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    
    - name: Install dependencies
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --only main
        pip install pyinstaller
    
    - name: Get version
      id: get_version
      run: |
        $version = python -c "from core.constants import APP_VERSION; print(APP_VERSION)"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
      shell: pwsh
    
    - name: Build executables
      run: python build.py
    
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          echo "$($_.Name) - $sizeMB MB"
        }
      shell: pwsh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MultiLangTranslator-v${{ steps.get_version.outputs.VERSION }}-windows
        path: |
          dist/*.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
        body: |
          ## Multi-Language Translator v${{ steps.get_version.outputs.VERSION }}
          
          ### Bug Fixes
          - Fixed keyboard listener cooldown timing issue
          - Fixed cache rollback logic error
          - Fixed timestamp preservation when loading from database
          - Fixed thread safety in cache manager
          
          ### Changes
          - Replaced PowerShell build script with cross-platform Python script
          - Updated to use English file names and paths
          - Improved build process and error handling
          
          ### Download
          - **MultiLangTranslator-v${{ steps.get_version.outputs.VERSION }}.exe** - Main application
          - **APIKeyTool-v${{ steps.get_version.outputs.VERSION }}.exe** - API key encryption tool
          
          ### System Requirements
          - Windows 10/11 (x64)
          - No additional dependencies required
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
