[tool.poetry]
name = "multilang-translator"
# 注意：发布版本由 core/constants.py 中的 APP_VERSION 统一管理
# 这里保留占位以满足 Poetry 的 schema,避免误导
version = "0.0.0"
description = "多语言互译器 — 支持 Gemini / OpenAI 的桌面翻译工具"
package-mode = false
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pycld2 = "*"
aiohttp = "*"
pyyaml = "*"
regex = "*"
pyperclip = "*"
pynput = "*"
pyautogui = "*"
certifi = "*"
Pillow = "*"
"ruamel.yaml" = "*"
cryptography = "*"
PyQt6 = "*"
pygetwindow = "*"
pywin32 = { version = "*", markers = "sys_platform == 'win32'" }
pydantic = "^2.11.7"
tenacity = "*"
aiosqlite = "*"
rapidfuzz = "*"
aiofiles = "^24.1.0"
xxhash = "^3.5.0"

[tool.poetry.scripts]
translator = "start:main"

[build-system]
requires = ["poetry-core>=1.5.2"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyinstaller = "*"
types-regex = "^2024.11.6.20250403"
types-pynput = "^1.8.1.20250318"
types-pyperclip = "^1.9.0.20250218"
types-pyautogui = "*"
mypy = "^1.16.1"
types-PyYAML = "*"
types-aiofiles = "^24.1.0.20250822"
ruff = "^0.12.8"
pytest = "^8.3.2"
pytest-asyncio = "^1.1.0"
pytest-cov = "^7.0.0"
